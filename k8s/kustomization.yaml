# Kustomization file for deploying DataShield OSINT to Kubernetes
# Usage: kubectl apply -k k8s/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: datashield

resources:
  # Namespace
  - namespace.yaml
  
  # Configuration
  - configmap.yaml
  - secrets.yaml
  
  # Stateful Services
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - elasticsearch-statefulset.yaml
  - minio-statefulset.yaml
  
  # Application Services
  - backend-deployment.yaml
  - frontend-deployment.yaml
  
  # Networking
  - ingress.yaml
  - network-policies.yaml
  
  # High Availability
  - pod-disruption-budget.yaml
  - resource-quotas.yaml
  
  # Monitoring
  - service-monitor.yaml
  
  # TLS Certificates
  - cert-manager-issuer.yaml

commonLabels:
  app.kubernetes.io/name: datashield-osint
  app.kubernetes.io/part-of: datashield
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/your-org/datashield-backend
    newTag: latest
  - name: ghcr.io/your-org/datashield-frontend
    newTag: latest

# Configuration transformations
configMapGenerator:
  - name: datashield-config
    behavior: merge
    literals:
      - DEPLOYMENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - KUBE_NAMESPACE=datashield

# Patches for environment-specific overrides
patchesStrategicMerge:
  # Add environment-specific patches here
  # - patches/production.yaml

# Resource name prefix (optional)
# namePrefix: prod-

# Labels to add to all resources
labels:
  - pairs:
      environment: production
      tier: production
