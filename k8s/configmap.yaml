apiVersion: v1
kind: ConfigMap
metadata:
  name: datashield-config
  namespace: datashield
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  POSTGRES_DB: "datashield"
  POSTGRES_USER: "datashield"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_BUCKET_NAME: "datashield-evidence"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  TOTP_ISSUER: "DataShield OSINT"
  RATE_LIMIT_PER_MINUTE: "60"
  SCAN_RATE_LIMIT_PER_HOUR: "10"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_FROM: "noreply@datashield.com"
  DATABASE_URL: "postgresql+asyncpg://datashield:$(POSTGRES_PASSWORD)@postgres-service:5432/datashield"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
  ELASTICSEARCH_URL: "http://elasticsearch-service:9200"
  MINIO_ENDPOINT: "minio-service:9000"
  CELERY_BROKER_URL: "redis://:$(REDIS_PASSWORD)@redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://:$(REDIS_PASSWORD)@redis-service:6379/2"
