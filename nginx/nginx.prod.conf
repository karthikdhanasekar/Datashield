# ══════════════════════════════════════════════════════════════════════════════
# DataShield OSINT - Production Nginx Configuration
# ══════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ══════════════════════════════════════════════════════════════════════════
    # Logging Configuration
    # ══════════════════════════════════════════════════════════════════════════
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';
    
    access_log /var/log/nginx/access.log json;

    # ══════════════════════════════════════════════════════════════════════════
    # Performance Optimization
    # ══════════════════════════════════════════════════════════════════════════
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # File upload limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Buffer settings
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ══════════════════════════════════════════════════════════════════════════
    # Gzip Compression
    # ══════════════════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # ══════════════════════════════════════════════════════════════════════════
    # Security Headers (Global)
    # ══════════════════════════════════════════════════════════════════════════
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Hide nginx version
    server_tokens off;

    # ══════════════════════════════════════════════════════════════════════════
    # Rate Limiting Zones
    # ══════════════════════════════════════════════════════════════════════════
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/h;
    
    # Connection limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ══════════════════════════════════════════════════════════════════════════
    # Upstream Backends
    # ══════════════════════════════════════════════════════════════════════════
    upstream backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # Caching
    # ══════════════════════════════════════════════════════════════════════════
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;

    # ══════════════════════════════════════════════════════════════════════════
    # HTTP to HTTPS Redirect
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;
        
        # Allow certbot verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # Main HTTPS Server
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # ──────────────────────────────────────────────────────────────────────
        # SSL Configuration
        # ──────────────────────────────────────────────────────────────────────
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        
        # HSTS (enable only after testing SSL works)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ──────────────────────────────────────────────────────────────────────
        # Security Headers (HTTPS specific)
        # ──────────────────────────────────────────────────────────────────────
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://yourdomain.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ──────────────────────────────────────────────────────────────────────
        # Connection limits
        # ──────────────────────────────────────────────────────────────────────
        limit_conn addr 10;

        # ──────────────────────────────────────────────────────────────────────
        # Frontend (Next.js)
        # ──────────────────────────────────────────────────────────────────────
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Backend API
        # ──────────────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            
            # Caching for GET requests
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Authentication Endpoints (Stricter rate limit)
        # ──────────────────────────────────────────────────────────────────────
        location ~ ^/api/v1/auth/(login|register|password-reset) {
            limit_req zone=auth burst=3 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Scan Endpoints (Very strict rate limit)
        # ──────────────────────────────────────────────────────────────────────
        location /api/v1/scans/ {
            limit_req zone=scan burst=2 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 300s;  # Scans can take time
        }

        # ──────────────────────────────────────────────────────────────────────
        # WebSocket Support
        # ──────────────────────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 3600s;  # 1 hour for long-lived connections
            proxy_send_timeout 3600s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Health Checks (No rate limit)
        # ──────────────────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://backend;
            access_log off;
            
            # Allow only from monitoring IPs
            # allow 10.0.0.0/8;
            # deny all;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Metrics (Internal only)
        # ──────────────────────────────────────────────────────────────────────
        location /metrics {
            proxy_pass http://backend;
            access_log off;
            
            # Restrict to internal networks only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ──────────────────────────────────────────────────────────────────────
        # API Documentation (Disable in production or protect)
        # ──────────────────────────────────────────────────────────────────────
        location /api/docs {
            # return 404;  # Uncomment to disable docs in production
            
            # Or protect with basic auth
            # auth_basic "Restricted";
            # auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://backend;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Static Files (with aggressive caching)
        # ──────────────────────────────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache api_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Block common attack vectors
        # ──────────────────────────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block suspicious user agents
        if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
            return 403;
        }

        # Block SQL injection patterns
        if ($args ~* "union.*select|insert.*into|drop.*table|exec.*xp_|benchmark.*\(") {
            return 403;
        }

        # Block file injection patterns
        if ($query_string ~* "[a-zA-Z0-9_]=http://|[a-zA-Z0-9_]=(\.\.//?)+|[a-zA-Z0-9_]=/([a-z0-9_.]//?)+") {
            return 403;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # API Subdomain (Optional - separate API domain)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        ssl_certificate /etc/nginx/ssl/api.fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/api.privkey.pem;
        
        # Same SSL config as main server
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;

        location / {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
