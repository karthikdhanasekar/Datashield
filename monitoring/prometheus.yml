# Prometheus Configuration for DataShield OSINT
# ══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'datashield-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # ════════════════════════════════════════════════════════════════════════════
  # Prometheus itself
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: 'prometheus'

  # ════════════════════════════════════════════════════════════════════════════
  # FastAPI Backend
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'datashield-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'backend:8000'
        labels:
          service: 'backend'
          tier: 'application'
    # Kubernetes service discovery (when deployed in K8s)
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - datashield
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     regex: datashield-backend
    #     action: keep
    #   - source_labels: [__meta_kubernetes_pod_name]
    #     target_label: pod
    #   - source_labels: [__meta_kubernetes_namespace]
    #     target_label: namespace

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL Exporter
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          service: 'postgres'
          tier: 'database'

  # ════════════════════════════════════════════════════════════════════════════
  # Redis Exporter
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: 'redis'
          tier: 'cache'

  # ════════════════════════════════════════════════════════════════════════════
  # Node Exporter (System Metrics)
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'node-exporter'
          tier: 'infrastructure'

  # ════════════════════════════════════════════════════════════════════════════
  # cAdvisor (Container Metrics)
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
        labels:
          service: 'cadvisor'
          tier: 'infrastructure'

  # ════════════════════════════════════════════════════════════════════════════
  # Nginx Exporter
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx-exporter:9113'
        labels:
          service: 'nginx'
          tier: 'proxy'

  # ════════════════════════════════════════════════════════════════════════════
  # Elasticsearch Exporter
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'elasticsearch'
    static_configs:
      - targets:
          - 'elasticsearch-exporter:9114'
        labels:
          service: 'elasticsearch'
          tier: 'search'

  # ════════════════════════════════════════════════════════════════════════════
  # MinIO Exporter
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets:
          - 'minio:9000'
        labels:
          service: 'minio'
          tier: 'storage'

  # ════════════════════════════════════════════════════════════════════════════
  # Celery Flower
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'celery-flower'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'flower:5555'
        labels:
          service: 'celery'
          tier: 'worker'

  # ════════════════════════════════════════════════════════════════════════════
  # Blackbox Exporter (Endpoint Monitoring)
  # ════════════════════════════════════════════════════════════════════════════
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://yourdomain.com
          - https://api.yourdomain.com/health
          - https://yourdomain.com/api/docs
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
          - elasticsearch:9200
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
