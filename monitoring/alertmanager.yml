# Alertmanager Configuration for DataShield OSINT
# ══════════════════════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${EMAIL_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert dispatching
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    # Security alerts
    - match:
        component: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 15m
      continue: true

    # Database alerts
    - match_re:
        component: ^(postgres|redis|elasticsearch)$
      receiver: 'database-team'
      repeat_interval: 30m

    # Infrastructure alerts
    - match:
        component: infrastructure
      receiver: 'devops-team'
      repeat_interval: 1h

    # Application alerts
    - match:
        component: backend
      receiver: 'backend-team'
      repeat_interval: 30m

    # Warning-level alerts
    - match:
        severity: warning
      receiver: 'warnings'
      repeat_interval: 4h

# Inhibition rules (suppress alerts based on other alerts)
inhibit_rules:
  # Inhibit warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit all alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']

  # Inhibit database connection alerts if database is down
  - source_match:
      alertname: 'PostgreSQLDown'
    target_match_re:
      alertname: 'PostgreSQL.*'
    equal: ['instance']

# Receiver configurations
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL_DEFAULT}'
        headers:
          Subject: '[DataShield] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL}'
        headers:
          Subject: '[CRITICAL] DataShield Alert'
        html: '{{ template "email.default.html" . }}'
    
    # Slack notifications
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: ':fire: Critical Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
    
    # PagerDuty (if configured)
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: 'critical'
        description: '{{ .GroupLabels.alertname }}'
        client: 'DataShield OSINT'
    
    # Telegram notifications
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_DEFAULT_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          <b>🚨 CRITICAL ALERT</b>
          {{ range .Alerts }}
          <b>Alert:</b> {{ .Labels.alertname }}
          <b>Severity:</b> {{ .Labels.severity }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          {{ end }}

  # Security team
  - name: 'security-team'
    email_configs:
      - to: '${ALERT_EMAIL_SECURITY}'
        headers:
          Subject: '[SECURITY] DataShield Security Alert'
        html: '{{ template "email.default.html" . }}'
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        title: ':shield: Security Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  # Database team
  - name: 'database-team'
    email_configs:
      - to: '${ALERT_EMAIL_DATABASE}'
        headers:
          Subject: '[DATABASE] DataShield Database Alert'
        html: '{{ template "email.default.html" . }}'

  # DevOps team
  - name: 'devops-team'
    email_configs:
      - to: '${ALERT_EMAIL_DEVOPS}'
        headers:
          Subject: '[INFRASTRUCTURE] DataShield Infrastructure Alert'
        html: '{{ template "email.default.html" . }}'
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#devops-alerts'
        title: ':warning: Infrastructure Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  # Backend team
  - name: 'backend-team'
    email_configs:
      - to: '${ALERT_EMAIL_BACKEND}'
        headers:
          Subject: '[APPLICATION] DataShield Application Alert'
        html: '{{ template "email.default.html" . }}'

  # Warnings (low priority)
  - name: 'warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warnings'
        title: 'DataShield Warning'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: false

  # Webhook for custom integrations
  - name: 'webhook'
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          bearer_token: '${ALERT_WEBHOOK_TOKEN}'
