# Docker Compose service for automated backups
# Add this to your docker-compose.yml or run separately

version: '3.9'

services:
  backup:
    image: postgres:15-alpine
    container_name: datashield_backup
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT}
    volumes:
      - ./scripts/backup:/scripts
      - backup_data:/backups
    networks:
      - datashield_net
    command: >
      sh -c "
      apk add --no-cache aws-cli dcron &&
      echo '0 2 * * * /scripts/backup-database.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
      crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  backup_data:
    driver: local

networks:
  datashield_net:
    external: true
